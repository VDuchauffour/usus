[package]
name = "usus"
version = "0.0.3"
edition = "2024"
description = "A CLI that reports AI inference usage against your allowance"
license = "MIT"
repository = "https://github.com/VDuchauffour/usus"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16.3"
dialoguer = "0.12.0"
dirs = "6"
indicatif = "0.18.4"
jsonschema = { version = "0.46", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
