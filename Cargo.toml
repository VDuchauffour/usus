[package]
name = "usus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
boa_engine = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
