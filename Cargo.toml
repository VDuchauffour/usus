[package]
name = "usus"
version = "0.0.1"
edition = "2024"
description = "Your best partner for AI harnesses"
license = "MIT"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1"
boa_engine = "0.21"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
indicatif = "0.18.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
